# Render Blueprint: Render dashboard → New → Blueprint → pick this repo.
# Keep exactly one instance: the game is kept in memory, so a second copy would split the players.
services:
  - type: web
    name: lifeboat
    runtime: node
    plan: free            # enough for 100 players at once (a full game uses ~2% of one CPU core, ~45 MB)
    region: singapore     # closest Render region to India
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: HOST_KEY     # Render asks for this once; it's your host page password
        sync: false
      - key: TRUST_PROXY  # Render sits in front of the server; this keeps per-device limits working
        value: "1"
      - key: NODE_VERSION
        value: "22"
